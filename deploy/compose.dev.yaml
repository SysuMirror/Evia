name: evia-development
services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_USER: evia
      POSTGRES_DB: evia
      POSTGRES_PASSWORD: ${EVIA_POSTGRES_PASSWORD:?Set EVIA_POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evia -d evia"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    profiles: [pipeline]
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    environment:
      CLUSTER_ID: ${EVIA_DEV_KAFKA_CLUSTER_ID:-}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    command:
      - /bin/bash
      - -ec
      - 'test -n "$$CLUSTER_ID" || { echo "EVIA_DEV_KAFKA_CLUSTER_ID is required" >&2; exit 1; }; exec /etc/kafka/docker/run'
    ports:
      - "127.0.0.1:19092:19092"
    cpus: 1.0
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    tmpfs:
      - /var/lib/kafka/data:size=512m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-cluster.sh api-versions --bootstrap-server localhost:9092 > /dev/null]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: '2'
  clickhouse:
    profiles: [pipeline]
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_USER: ${EVIA_TEST_CLICKHOUSE_USERNAME:-}
      CLICKHOUSE_PASSWORD: ${EVIA_TEST_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    entrypoint:
      - /bin/bash
      - -ec
      - 'test -n "$$CLICKHOUSE_PASSWORD" && test -n "$$CLICKHOUSE_USER" || { echo "EVIA_TEST_CLICKHOUSE_USERNAME and EVIA_TEST_CLICKHOUSE_PASSWORD are required" >&2; exit 1; }; exec /entrypoint.sh'
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    cpus: 2.0
    mem_limit: 2048m
    memswap_limit: 2048m
    pids_limit: 512
    tmpfs:
      - /var/lib/clickhouse:size=512m,uid=101,gid=101,mode=0700
      - /var/log/clickhouse-server:size=64m,uid=101,gid=101,mode=0700
    configs:
      - source: clickhouse-development
        target: /etc/clickhouse-server/config.d/evia-development.xml
      - source: clickhouse-development-users
        target: /etc/clickhouse-server/users.d/evia-development.xml
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --host 127.0.0.1 --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: '2'
  redis:
    profiles: [pipeline]
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    user: redis
    environment:
      REDIS_PASSWORD: ${EVIA_DEV_REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$REDIS_PASSWORD" || { echo "EVIA_DEV_REDIS_PASSWORD is required" >&2; exit 1; }
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nport 6379\nsave ""\nappendonly no\nmaxmemory 64mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:16379:6379"
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    tmpfs:
      - /data:size=16m,uid=999,gid=999,mode=0700
      - /tmp:size=1m,mode=1777
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning --pass "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options:
        max-size: 5m
        max-file: '2'
configs:
  clickhouse-development:
    content: |
      <clickhouse>
        <logger><level>warning</level></logger>
        <max_server_memory_usage>1610612736</max_server_memory_usage>
        <max_thread_pool_size>256</max_thread_pool_size>
        <max_thread_pool_free_size>16</max_thread_pool_free_size>
        <max_concurrent_queries>8</max_concurrent_queries>
        <background_schedule_pool_size>16</background_schedule_pool_size>
        <background_buffer_flush_schedule_pool_size>4</background_buffer_flush_schedule_pool_size>
        <background_message_broker_schedule_pool_size>4</background_message_broker_schedule_pool_size>
        <background_distributed_schedule_pool_size>4</background_distributed_schedule_pool_size>
        <mark_cache_size>67108864</mark_cache_size>
        <uncompressed_cache_size>16777216</uncompressed_cache_size>
        <trace_log remove="1"/>
        <text_log remove="1"/>
        <metric_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <query_metric_log remove="1"/>
        <query_thread_log remove="1"/>
        <processors_profile_log remove="1"/>
      </clickhouse>
  clickhouse-development-users:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <max_threads>2</max_threads>
            <max_insert_threads>2</max_insert_threads>
            <max_final_threads>2</max_final_threads>
            <max_memory_usage>1073741824</max_memory_usage>
          </default>
        </profiles>
      </clickhouse>
volumes:
  postgres-data:
