# Standalone Redis Cluster topology for the HA drill.
#
# Six nodes form a three-master, three-replica sharded cluster. An init
# service runs `redis-cli --cluster create` once the data nodes are healthy;
# the cluster state lives on named volumes and is removed with `down -v`.
# Ephemeral by design: hard-coded drill password, no TLS, loopback-only port
# publication, so this file is never a production template.
#
# Static IPs on an isolated bridge keep the inter-node cluster bus
# (port + 10000) and client ports stable across recreations. The host reaches
# the seed nodes through the published loopback client ports.
services:
  redis-node-1:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    command:
      - "/bin/sh"
      - "-ec"
      - |
        exec redis-server \
          --port 6379 \
          --cluster-enabled yes \
          --cluster-config-file nodes.conf \
          --cluster-node-timeout 5000 \
          --appendonly no \
          --save "" \
          --protected-mode no \
          --maxmemory 256mb \
          --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:16479:6379"
    cpus: 0.5
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 128
    volumes:
      - node-data-1:/data
    networks:
      ha-redis-cluster-net:
        ipv4_address: 172.31.80.10
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 2s
      retries: 30
    logging:
      options:
        max-size: 5m
        max-file: '2'

