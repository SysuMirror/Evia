  cluster-init:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until [ "$(redis-cli -h 172.31.80.15 ping 2>/dev/null)" = "PONG" ]; do sleep 1; done
        if ! redis-cli -h 172.31.80.10 cluster info | grep -q "cluster_state:ok"; then
          redis-cli --cluster create \
            172.31.80.10:6379 172.31.80.11:6379 172.31.80.12:6379 \
            172.31.80.13:6379 172.31.80.14:6379 172.31.80.15:6379 \
            --cluster-replicas 1 --cluster-yes
        fi
        for i in $(seq 1 30); do
          if redis-cli -h 172.31.80.10 cluster info | grep -q "cluster_state:ok"; then
            echo "cluster initialized"
            exit 0
          fi
          sleep 1
        done
        echo "cluster did not reach ok state" >&2
        exit 1
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    networks:
      ha-redis-cluster-net:
        ipv4_address: 172.31.80.20
    restart: "no"

volumes:
  node-data-1:
  node-data-2:
  node-data-3:
  node-data-4:
  node-data-5:
  node-data-6:

networks:
  ha-redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.80.0/24
