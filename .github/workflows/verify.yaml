name: Verify implemented modules

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: evia
          POSTGRES_DB: evia_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U evia -d evia_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      EVIA_TEST_DATABASE_URL: postgres://evia:synthetic-ci-database-only@127.0.0.1:55432/evia_ci?sslmode=disable
      EVIA_DATABASE_URL: postgres://evia:synthetic-ci-database-only@127.0.0.1:55432/evia_ci?sslmode=disable
      EVIA_LISTEN: 127.0.0.1:8080
      EVIA_PUBLIC_ORIGIN: http://127.0.0.1:5173
      EVIA_ALLOW_INSECURE_HTTP: 'true'
      EVIA_BOOTSTRAP_USERNAME: ci-admin
      EVIA_BOOTSTRAP_DISPLAY_NAME: Synthetic CI administrator
      EVIA_E2E_USERNAME: ci-admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install required verification dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          python -m pip install -r tooling/requirements.txt
          pnpm exec playwright install --with-deps chromium
      - name: Verify generated code matches contracts
        run: make generated-check
      - name: Verify naming, schemas, Go race tests and frontend
        run: make check
      - name: Verify PostgreSQL persistence in isolated schemas
        run: make integration-test
      - name: Prepare the real browser dependency chain
        run: |
          ./deploy/dev-env init "$RUNNER_TEMP/evia-dependencies.env"
          ./deploy/dev-env up "$RUNNER_TEMP/evia-dependencies.env" kafka clickhouse redis
          ./deploy/dev-env check "$RUNNER_TEMP/evia-dependencies.env" kafka clickhouse redis
          python tooling/verification/browser_runtime.py init "$RUNNER_TEMP/evia-dependencies.env" "$RUNNER_TEMP/evia-browser.env"
          python tooling/verification/browser_runtime.py prepare "$RUNNER_TEMP/evia-dependencies.env" "$RUNNER_TEMP/evia-browser.env"
      - name: Build and initialize the dedicated browser database
        run: |
          go -C backend build -o "$RUNNER_TEMP/evia" ./cmd/evia
          python tooling/verification/browser_runtime.py run "$RUNNER_TEMP/evia-browser.env" -- "$RUNNER_TEMP/evia" migrate
          python tooling/verification/browser_runtime.py run "$RUNNER_TEMP/evia-browser.env" -- "$RUNNER_TEMP/evia" bootstrap
      - name: Start the API and real ingest, query and delivery workers
        run: |
          python tooling/verification/browser_runtime.py run "$RUNNER_TEMP/evia-browser.env" -- bash -eu -c '
            umask 077
            for command in serve ingest-worker query-worker erasure-worker retention-worker export-worker identity-worker; do
              "$RUNNER_TEMP/evia" "$command" > "$RUNNER_TEMP/evia-$command.log" 2>&1 &
              echo "$!" > "$RUNNER_TEMP/evia-$command.pid"
            done
          '
          python - <<'PY'
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request
          for attempt in range(120):
              for command in ('serve', 'ingest-worker', 'query-worker', 'erasure-worker', 'retention-worker', 'export-worker', 'identity-worker'):
                  pid = int((Path(os.environ['RUNNER_TEMP']) / f'evia-{command}.pid').read_text())
                  try:
                      os.kill(pid, 0)
                  except ProcessLookupError:
                      raise SystemExit(f'{command} stopped; inspect private runner logs.') from None
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=1) as response:
                      if response.status == 204:
                          break
              except (OSError, urllib.error.URLError):
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit('Control API did not become ready; inspect private runner logs.')
          PY
      - name: Verify governance through the real operator and HTTP interfaces
        run: python tooling/verification/browser_runtime.py run "$RUNNER_TEMP/evia-browser.env" -- python tooling/verification/governance_smoke.py --binary "$RUNNER_TEMP/evia"
      - name: Verify independent metrics through real ingestion and query workers
        run: python tooling/verification/browser_runtime.py run "$RUNNER_TEMP/evia-browser.env" -- python tooling/verification/metrics_smoke.py --binary "$RUNNER_TEMP/evia"
      - name: Verify browser flows against the complete real chain
        run: python tooling/verification/browser_runtime.py run "$RUNNER_TEMP/evia-browser.env" -- make browser-test
      - name: Stop CI runtime processes and remove dependency containers
        if: always()
        run: |
          for command in serve ingest-worker query-worker erasure-worker retention-worker export-worker identity-worker; do
            if [ -f "$RUNNER_TEMP/evia-$command.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/evia-$command.pid")" 2>/dev/null || true
            fi
          done
          if [ -f "$RUNNER_TEMP/evia-dependencies.env" ]; then
            ./deploy/dev-env down "$RUNNER_TEMP/evia-dependencies.env" kafka clickhouse redis
          fi
  dependency-integration:
    name: ${{ matrix.module }} integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: Kafka and ClickHouse pipeline
            services: kafka clickhouse
            target: pipeline-test
          - module: Redis admission budget
            services: redis
            target: budget-test
          - module: ClickHouse analysis query
            services: clickhouse
            target: query-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Start only the selected real dependencies
        run: |
          ./deploy/dev-env init "$RUNNER_TEMP/evia-dependencies.env"
          ./deploy/dev-env up "$RUNNER_TEMP/evia-dependencies.env" ${{ matrix.services }}
          ./deploy/dev-env check "$RUNNER_TEMP/evia-dependencies.env" ${{ matrix.services }}
      - name: Verify the module against real dependencies
        run: ./deploy/dev-env run "$RUNNER_TEMP/evia-dependencies.env" -- make "${{ matrix.target }}"
      - name: Remove this job's dependency containers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evia-dependencies.env" ]; then
            ./deploy/dev-env down "$RUNNER_TEMP/evia-dependencies.env" ${{ matrix.services }}
          fi
