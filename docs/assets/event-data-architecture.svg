<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Noto Sans", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; letter-spacing: -0.2px; }
      .subtitle { font-family: "Noto Sans", sans-serif; font-size: 11.5px; font-weight: 400; fill: #64748b; }

      .lane-box { fill: #f8f9fb; stroke: #dce2ea; stroke-width: 1; rx: 4; }
      .lane-tag { font-family: "Noto Sans", sans-serif; font-size: 11px; font-weight: 700; fill: #334155; letter-spacing: 0.2px; }

      .runtime-frame { fill: #f2f6fb; fill-opacity: 0.65; stroke: #64748b; stroke-width: 1; stroke-dasharray: 4,3; rx: 4; }
      .runtime-label { font-family: "Noto Sans", sans-serif; font-size: 10.5px; font-weight: 600; fill: #334155; }

      /* Unified refined charcoal-slate borders across all solid components */
      .box-client { fill: #ffffff; stroke: #3b4b5c; stroke-width: 1.15; rx: 3; }
      .box-api { fill: #e9f0f8; stroke: #2c3e50; stroke-width: 1.2; rx: 3; }
      .box-worker { fill: #eaf3ef; stroke: #2c3e50; stroke-width: 1.2; rx: 3; }
      .box-worker-group { fill: #f3f8f5; stroke: #94a89e; stroke-width: 1; rx: 4; }
      .box-worker-tile { fill: #ffffff; stroke: #3b4b5c; stroke-width: 1.05; rx: 3; }

      .store-body { fill: #f4f1ea; stroke: #3b4b5c; stroke-width: 1.15; }
      .store-cap { fill: #eae5d8; stroke: #3b4b5c; stroke-width: 1.15; }

      .box-planned-outer { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4,3; rx: 4; }
      .box-planned { fill: #ffffff; stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 4,3; rx: 3; }

      .node-title { font-family: "Noto Sans", sans-serif; font-size: 12.2px; font-weight: 700; fill: #0f172a; }
      .node-mono { font-family: "Fira Code", "DejaVu Sans Mono", monospace; font-size: 11.2px; font-weight: 600; fill: #0f172a; }
      .node-sub { font-family: "Noto Sans", sans-serif; font-size: 10px; font-weight: 400; fill: #475569; }
      .node-sub-mono { font-family: "Fira Code", "DejaVu Sans Mono", monospace; font-size: 9.4px; font-weight: 500; fill: #334155; }
      .tile-title { font-family: "Fira Code", "DejaVu Sans Mono", monospace; font-size: 9.8px; font-weight: 600; fill: #0f172a; }
      .tile-sub { font-family: "Noto Sans", sans-serif; font-size: 9.2px; fill: #475569; }

      .edge { fill: none; stroke: #334155; stroke-width: 1.15; stroke-linejoin: miter; }
      .edge-dashed { fill: none; stroke: #475569; stroke-width: 1.1; stroke-dasharray: 4,3; stroke-linejoin: miter; }
      .edge-label { font-family: "Noto Sans", sans-serif; font-size: 9.8px; font-weight: 500; fill: #334155; }
      .edge-mono { font-family: "Fira Code", "DejaVu Sans Mono", monospace; font-size: 9.1px; font-weight: 500; fill: #334155; }

      .legend-title { font-family: "Noto Sans", sans-serif; font-size: 10.5px; font-weight: 700; fill: #334155; }
      .legend-text { font-family: "Noto Sans", sans-serif; font-size: 10.5px; fill: #475569; }
      .caption { font-family: "Latin Modern Roman", "LM Roman 10", Georgia, serif; font-size: 12.5px; fill: #334155; }
      .caption-bold { font-family: "Latin Modern Roman", "LM Roman 10", Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .rule { stroke: #e2e8f0; stroke-width: 1; }
    </style>

    <!-- Crisp TikZ stealth-style arrowhead -->
    <marker id="stealth" viewBox="0 0 10 8" refX="8.5" refY="4" markerWidth="7" markerHeight="5.6" orient="auto-start-reverse">
      <path d="M 0 0.8 L 9 4 L 0 7.2 L 2.2 4 z" fill="#334155"/>
    </marker>
    <marker id="stealth-open" viewBox="0 0 10 8" refX="8.5" refY="4" markerWidth="7" markerHeight="5.6" orient="auto">
      <path d="M 1 1 L 8.2 4 L 1 7" fill="none" stroke="#475569" stroke-width="1.35"/>
    </marker>
  </defs>

  <!-- Pure white canvas -->
  <rect class="bg" x="0" y="0" width="1400" height="760"/>

  <!-- Understated academic header -->
  <text class="title" x="32" y="34">Evia — Logical System Architecture</text>
  <text class="subtitle" x="32" y="52">Contract-first event ingestion, durable processing, multi-model analytics, and online experimentation</text>
  <line class="rule" x1="32" y1="62" x2="1368" y2="62"/>

  <!-- ==================== SWIMLANE (a): CONTROL & QUERY PLANE ==================== -->
  <rect class="lane-box" x="32" y="76" width="1336" height="186"/>
  <text class="lane-tag" x="46" y="96">(a) Control &amp; Query Plane</text>

  <!-- ==================== SWIMLANE (b): EVENT INGESTION DATA PLANE ==================== -->
  <rect class="lane-box" x="32" y="274" width="1336" height="264"/>
  <text class="lane-tag" x="46" y="294">(b) Event Ingestion Data Plane</text>

  <!-- ==================== SWIMLANE (c): GOVERNANCE WORKERS & PLANNED EXTENSION ==================== -->
  <rect class="lane-box" x="32" y="550" width="1336" height="148"/>
  <text class="lane-tag" x="46" y="570">(c) Governance &amp; Lifecycle Workers / Planned Extension</text>

  <!-- ==================== UNIFIED GO RUNTIME FRAME ==================== -->
  <rect class="runtime-frame" x="374" y="98" width="218" height="320"/>
  <text class="runtime-label" x="483" y="116" text-anchor="middle">Unified Go Runtime (evia serve)</text>

  <!-- ==================== LANE (a) NODES ==================== -->
  <!-- React Console -->
  <rect class="box-client" x="48" y="114" width="184" height="56"/>
  <text class="node-title" x="140" y="136" text-anchor="middle">React Console</text>
  <text class="node-sub" x="140" y="153" text-anchor="middle">Session / CSRF / OAuth2 PKCE</text>

  <!-- Business Agents -->
  <rect class="box-client" x="48" y="184" width="184" height="56"/>
  <text class="node-title" x="140" y="206" text-anchor="middle">Business Agents</text>
  <text class="node-sub" x="140" y="223" text-anchor="middle">Public Skills / Machine Bearer</text>

  <!-- Control & Analysis API -->
  <rect class="box-api" x="388" y="130" width="190" height="90"/>
  <text class="node-title" x="483" y="153" text-anchor="middle">Control &amp; Analysis API</text>
  <text class="node-sub-mono" x="483" y="170" text-anchor="middle">/api/v1/*</text>
  <text class="node-sub" x="483" y="188" text-anchor="middle">Catalog, Releases, Experiments,</text>
  <text class="node-sub" x="483" y="203" text-anchor="middle">Metrics, Dashboards, Governance</text>

  <!-- PostgreSQL Cylinder -->
  <g id="pg-store">
    <path class="store-body" d="M 708 124 L 708 218 A 79 13 0 0 0 866 218 L 866 124 Z"/>
    <ellipse class="store-cap" cx="787" cy="124" rx="79" ry="13"/>
    <text class="node-title" x="787" y="157" text-anchor="middle">PostgreSQL</text>
    <text class="node-sub" x="787" y="175" text-anchor="middle">Metadata, Releases,</text>
    <text class="node-sub" x="787" y="190" text-anchor="middle">Experiments, Identity Graph,</text>
    <text class="node-sub" x="787" y="205" text-anchor="middle">Job Queue &amp; Audit</text>
  </g>

  <!-- query-worker -->
  <rect class="box-worker" x="960" y="130" width="178" height="90"/>
  <text class="node-mono" x="1049" y="153" text-anchor="middle">query-worker</text>
  <text class="node-sub" x="1049" y="172" text-anchor="middle">Trend, Funnel, Retention,</text>
  <text class="node-sub" x="1049" y="187" text-anchor="middle">Path, Attribution, Heatmap,</text>
  <text class="node-sub" x="1049" y="202" text-anchor="middle">Formula DAG, A/B Statistics</text>

  <!-- ==================== LANE (b) NODES ==================== -->
  <!-- Browser SDK -->
  <rect class="box-client" x="48" y="314" width="184" height="70"/>
  <text class="node-title" x="140" y="335" text-anchor="middle">Browser SDK</text>
  <text class="node-sub-mono" x="140" y="351" text-anchor="middle">@evia/browser-sdk</text>
  <text class="node-sub" x="140" y="367" text-anchor="middle">Emit / FNV-1a Bucketing / Replay</text>

  <!-- Server Applications -->
  <rect class="box-client" x="48" y="408" width="184" height="56"/>
  <text class="node-title" x="140" y="430" text-anchor="middle">Server Applications</text>
  <text class="node-sub" x="140" y="447" text-anchor="middle">HTTP Batch Collect API</text>

  <!-- Collection & Config API -->
  <rect class="box-api" x="388" y="310" width="190" height="94"/>
  <text class="node-title" x="483" y="333" text-anchor="middle">Collection &amp; Config API</text>
  <text class="node-sub-mono" x="483" y="350" text-anchor="middle">/v1/config, /v1/collect</text>
  <text class="node-sub" x="483" y="368" text-anchor="middle">Origin/Key Auth, Schema Check,</text>
  <text class="node-sub" x="483" y="384" text-anchor="middle">Ed25519 Signature &amp; ETag Cache</text>

  <!-- Redis Cylinder (outside runtime frame) -->
  <g id="redis-store">
    <path class="store-body" d="M 408 466 L 408 514 A 75 10.5 0 0 0 558 514 L 558 466 Z"/>
    <ellipse class="store-cap" cx="483" cy="466" rx="75" ry="10.5"/>
    <text class="node-title" x="483" y="492" text-anchor="middle">Redis</text>
    <text class="node-sub" x="483" y="507" text-anchor="middle">Distributed Token Bucket</text>
  </g>

  <!-- Apache Kafka Cylinder -->
  <g id="kafka-store">
    <path class="store-body" d="M 708 318 L 708 398 A 79 12.5 0 0 0 866 398 L 866 318 Z"/>
    <ellipse class="store-cap" cx="787" cy="318" rx="79" ry="12.5"/>
    <text class="node-title" x="787" y="352" text-anchor="middle">Apache Kafka</text>
    <text class="node-sub" x="787" y="369" text-anchor="middle">Durable Event Topic,</text>
    <text class="node-sub" x="787" y="384" text-anchor="middle">Readiness Probe, Dead-Letter</text>
  </g>

  <!-- ingest-worker -->
  <rect class="box-worker" x="960" y="312" width="178" height="90"/>
  <text class="node-mono" x="1049" y="335" text-anchor="middle">ingest-worker</text>
  <text class="node-sub" x="1049" y="354" text-anchor="middle">Decode, Erasure Barrier,</text>
  <text class="node-sub" x="1049" y="369" text-anchor="middle">Sync Fact Insert,</text>
  <text class="node-sub" x="1049" y="384" text-anchor="middle">Readiness Lease Renewal</text>

  <!-- ClickHouse Cylinder -->
  <g id="ch-store">
    <path class="store-body" d="M 1226 298 L 1226 418 A 66 13 0 0 0 1358 418 L 1358 298 Z"/>
    <ellipse class="store-cap" cx="1292" cy="298" rx="66" ry="13"/>
    <text class="node-title" x="1292" y="341" text-anchor="middle">ClickHouse</text>
    <text class="node-sub-mono" x="1292" y="359" text-anchor="middle">event_facts_raw</text>
    <text class="node-sub" x="1292" y="376" text-anchor="middle">Deduplicated Read View,</text>
    <text class="node-sub" x="1292" y="391" text-anchor="middle">Hot-Key Property Slots</text>
  </g>

  <!-- ==================== LANE (c) NODES (6 structured worker tiles + Planned Extension) ==================== -->
  <rect class="box-worker-group" x="48" y="582" width="932" height="102"/>
  <text class="runtime-label" x="62" y="601">Background Governance &amp; Lifecycle Workers (independent Go subcommands)</text>

  <!-- 6 evenly spaced crisp tiles inside x=60..968 (width=142 each, gap=12) -->
  <rect class="box-worker-tile" x="60" y="612" width="142" height="58"/>
  <text class="tile-title" x="131" y="635" text-anchor="middle">identity-worker</text>
  <text class="tile-sub" x="131" y="652" text-anchor="middle">Graph Folding &amp; Snapshots</text>

  <rect class="box-worker-tile" x="214" y="612" width="142" height="58"/>
  <text class="tile-title" x="285" y="635" text-anchor="middle">erasure-worker</text>
  <text class="tile-sub" x="285" y="652" text-anchor="middle">Compliance &amp; Tombstones</text>

  <rect class="box-worker-tile" x="368" y="612" width="142" height="58"/>
  <text class="tile-title" x="439" y="635" text-anchor="middle">export-worker</text>
  <text class="tile-sub" x="439" y="652" text-anchor="middle">CSV / NDJSON / Parquet</text>

  <rect class="box-worker-tile" x="522" y="612" width="142" height="58"/>
  <text class="tile-title" x="593" y="635" text-anchor="middle">content-worker</text>
  <text class="tile-sub" x="593" y="652" text-anchor="middle">Encrypted Replay Chunks</text>

  <rect class="box-worker-tile" x="676" y="612" width="142" height="58"/>
  <text class="tile-title" x="747" y="635" text-anchor="middle">retention-worker</text>
  <text class="tile-sub" x="747" y="652" text-anchor="middle">TTL Sweeps &amp; Archiving</text>

  <rect class="box-worker-tile" x="830" y="612" width="138" height="58"/>
  <text class="tile-title" x="899" y="635" text-anchor="middle">backfill-worker</text>
  <text class="tile-sub" x="899" y="652" text-anchor="middle">Controlled History Replay</text>

  <!-- Planned Extension -->
  <rect class="box-planned-outer" x="1012" y="582" width="340" height="102"/>
  <text class="runtime-label" x="1182" y="601" text-anchor="middle">Planned Extension</text>
  <rect class="box-planned" x="1032" y="612" width="300" height="58"/>
  <text class="node-title" x="1182" y="635" text-anchor="middle">Apache Flink</text>
  <text class="node-sub" x="1182" y="652" text-anchor="middle">Stateful Stream Processing (Separate Project)</text>

  <!-- ==================== ALL EDGES ==================== -->

  <!-- Clients -> Control API -->
  <path class="edge" d="M 232 142 L 304 142 L 304 162 L 387 162" marker-end="url(#stealth)"/>
  <path class="edge" d="M 232 212 L 304 212 L 304 188 L 387 188" marker-end="url(#stealth)"/>
  <text class="edge-mono" x="308" y="134" text-anchor="middle">HTTPS /api/v1/*</text>

  <!-- Control API <-> PostgreSQL -->
  <line class="edge" x1="579" y1="175" x2="707" y2="175" marker-start="url(#stealth)" marker-end="url(#stealth)"/>
  <text class="edge-label" x="643" y="166" text-anchor="middle">Transactions</text>
  <text class="edge-label" x="643" y="189" text-anchor="middle">&amp; Audit</text>

  <!-- PostgreSQL <-> query-worker -->
  <line class="edge" x1="866" y1="156" x2="959" y2="156" marker-end="url(#stealth)"/>
  <text class="edge-label" x="913" y="148" text-anchor="middle">Lease Jobs</text>
  <line class="edge" x1="960" y1="194" x2="867" y2="194" marker-end="url(#stealth)"/>
  <text class="edge-label" x="913" y="186" text-anchor="middle">Persist Results</text>

  <!-- query-worker -> ClickHouse -->
  <path class="edge" d="M 1138 175 L 1292 175 L 1292 284" marker-end="url(#stealth)"/>
  <text class="edge-label" x="1292" y="153" text-anchor="middle">Analytical Read View</text>
  <text class="edge-label" x="1292" y="166" text-anchor="middle">&amp; Hot-Key Slots</text>

  <!-- Browser SDK -> Collection API -->
  <line class="edge" x1="232" y1="347" x2="387" y2="347" marker-end="url(#stealth)"/>
  <text class="edge-mono" x="309" y="324" text-anchor="middle">GET /v1/config</text>
  <text class="edge-mono" x="309" y="337" text-anchor="middle">(Ed25519, ETag 304)</text>
  <text class="edge-mono" x="309" y="362" text-anchor="middle">&amp; POST /v1/collect</text>

  <!-- Server Apps -> Collection API -->
  <path class="edge" d="M 232 436 L 308 436 L 308 382 L 387 382" marker-end="url(#stealth)"/>
  <text class="edge-mono" x="308" y="451" text-anchor="middle">POST /v1/collect</text>
  <text class="edge-label" x="308" y="464" text-anchor="middle">(Bearer Auth)</text>

  <!-- Collection API <-> Redis -->
  <line class="edge" x1="483" y1="405" x2="483" y2="455" marker-start="url(#stealth)" marker-end="url(#stealth)"/>
  <text class="edge-label" x="493" y="434">Admission Budget</text>

  <!-- Collection API -> Kafka -->
  <line class="edge" x1="578" y1="358" x2="707" y2="358" marker-end="url(#stealth)"/>
  <text class="edge-label" x="635" y="349" text-anchor="middle">All-ISR Zstd</text>
  <text class="edge-label" x="635" y="373" text-anchor="middle">Produce</text>

  <!-- Kafka -> ingest-worker -->
  <line class="edge" x1="866" y1="358" x2="959" y2="358" marker-end="url(#stealth)"/>
  <text class="edge-label" x="913" y="349" text-anchor="middle">Poll &amp; Commit</text>

  <!-- ingest-worker -> ClickHouse -->
  <line class="edge" x1="1138" y1="358" x2="1225" y2="358" marker-end="url(#stealth)"/>
  <text class="edge-mono" x="1182" y="347" text-anchor="middle">JSONEachRow</text>
  <text class="edge-label" x="1182" y="373" text-anchor="middle">Sync Insert</text>

  <!-- ingest-worker --(Erasure Tombstone Check)--> PostgreSQL -->
  <path class="edge-dashed" d="M 1049 312 L 1049 250 L 828 250 L 828 232" marker-end="url(#stealth-open)"/>
  <text class="edge-label" x="939" y="243" text-anchor="middle">Erasure Tombstone Check</text>

  <!-- Governance Workers -> PostgreSQL (clean x=688 corridor + semicircular bridge over y=358) -->
  <path class="edge" d="M 688 582 L 688 364 A 6 6 0 0 1 688 352 L 688 249 L 752 249 L 752 232" marker-end="url(#stealth)"/>
  <text class="edge-label" x="678" y="488" text-anchor="end">State, Metadata</text>
  <text class="edge-label" x="678" y="502" text-anchor="end">&amp; Snapshots</text>

  <!-- Governance Workers -> ClickHouse -->
  <path class="edge" d="M 910 582 L 910 492 L 1292 492 L 1292 432" marker-end="url(#stealth)"/>
  <text class="edge-label" x="1102" y="484" text-anchor="middle">Identity Scans, Retention Sweeps, Exports &amp; Backfill</text>

  <!-- ==================== FOOTER: LEGEND & FORMAL LATEX-STYLE CAPTION ==================== -->
  <line class="rule" x1="32" y1="712" x2="1368" y2="712"/>

  <!-- Compact Legend -->
  <text class="legend-title" x="36" y="737">Legend</text>

  <rect class="box-client" x="90" y="726" width="22" height="14"/>
  <text class="legend-text" x="119" y="737">Client / Agent</text>

  <rect class="box-api" x="206" y="726" width="22" height="14"/>
  <text class="legend-text" x="235" y="737">API / Runtime</text>

  <rect class="box-worker" x="322" y="726" width="22" height="14"/>
  <text class="legend-text" x="351" y="737">Worker</text>

  <rect class="store-body" x="408" y="726" width="22" height="14" rx="2"/>
  <text class="legend-text" x="437" y="737">Storage / Queue</text>

  <rect class="box-planned" x="538" y="726" width="22" height="14"/>
  <text class="legend-text" x="567" y="737">Planned</text>

  <!-- Formal Paper Caption -->
  <text class="caption" x="1366" y="737" text-anchor="end"><tspan class="caption-bold">Fig. 1.</tspan> Logical architecture and trust boundaries of Evia (logical model; not a capacity claim).</text>
</svg>
